<svg xmlns="http://www.w3.org/2000/svg" width="96" height="84" viewBox="0 0 96 84">
  <defs>
    <!-- Back folder plate gradient -->
    <linearGradient id="backGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#416df0"/>
      <stop offset="100%" stop-color="#284ecf"/>
    </linearGradient>
    
    <!-- Front flap gradient: vibrant macOS/Fluent style cornflower blue -->
    <linearGradient id="frontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ea0ff"/>
      <stop offset="100%" stop-color="#3d6df2"/>
    </linearGradient>

    <!-- Inner document paper gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d6e4ff"/>
    </linearGradient>

    <!-- Top highlight reflection gradient -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Ground drop shadow -->
  <ellipse cx="48" cy="79" rx="40" ry="4" fill="#0b132b" opacity="0.32"/>

  <!-- Back plate with tab (top at y=5, tab to y=14.5, bottom to y=76) -->
  <path d="M 8 13
           C 8 8.5 11.5 5 16 5
           L 36 5
           C 40.5 5 44.5 7.5 47 11.5
           L 49 14.5
           L 82 14.5
           C 86.5 14.5 90 18 90 22.5
           L 90 70
           C 90 74.5 86.5 77 82 77
           L 14 77
           C 9.5 77 8 74.5 8 70
           Z"
        fill="url(#backGrad)"/>

  <!-- Interior document sheet hint peeking out -->
  <rect x="18" y="10" width="60" height="20" rx="3.5" fill="url(#paperGrad)"/>

  <!-- Front flap: fills width 84px, height 59px (from y=18 to y=77) with smooth 12px corners -->
  <rect x="6" y="18" width="84" height="59" rx="12" ry="12" fill="url(#frontGrad)"/>

  <!-- Top rim highlight line -->
  <path d="M 17 19 L 79 19"
        stroke="url(#highlightGrad)"
        stroke-width="1.3"
        stroke-linecap="round"/>
</svg>
