<svg xmlns="http://www.w3.org/2000/svg" width="96" height="76" viewBox="0 0 96 76">
  <defs>
    <!-- Back folder gradient: rich deep royal blue -->
    <linearGradient id="backGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4d74f5"/>
      <stop offset="100%" stop-color="#3454cf"/>
    </linearGradient>
    
    <!-- Front flap gradient: vibrant soft cornflower blue -->
    <linearGradient id="frontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6f98ff"/>
      <stop offset="100%" stop-color="#4e78f4"/>
    </linearGradient>

    <!-- Inner document paper gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f4ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#dbe6ff" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Top highlight reflection gradient -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Soft ground shadow below folder -->
  <ellipse cx="48" cy="71" rx="38" ry="4" fill="#0b132b" opacity="0.28"/>

  <!-- Back plate with rounded tab -->
  <path d="M 12 16
           C 12 11.5 15.5 8 20 8
           L 36 8
           C 40 8 43.5 10.5 45.5 14
           L 48 18
           L 76 18
           C 80.5 18 84 21.5 84 26
           L 84 62
           C 84 66.5 80.5 70 76 70
           L 20 70
           C 15.5 70 12 66.5 12 62
           Z"
        fill="url(#backGrad)"/>

  <!-- Interior document hint peeking out -->
  <rect x="20" y="14" width="56" height="24" rx="4" fill="url(#paperGrad)"/>

  <!-- Front flap: smooth modern squircle -->
  <rect x="10" y="23" width="76" height="47" rx="10" ry="10" fill="url(#frontGrad)"/>

  <!-- Front flap top rim highlight -->
  <path d="M 20 23 L 76 23"
        stroke="url(#highlightGrad)"
        stroke-width="1.2"
        stroke-linecap="round"/>

  <!-- Subtle interior shadow at top of front flap -->
  <path d="M 10 33 C 18 33 78 33 86 33"
        stroke="#3b5ec9"
        stroke-width="0.75"
        stroke-opacity="0.2"
        fill="none"/>
</svg>
