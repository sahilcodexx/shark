<svg xmlns="http://www.w3.org/2000/svg" width="96" height="84" viewBox="0 0 96 84">
  <defs>
    <linearGradient id="vidDocGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="vidFoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="vidBadgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="48" cy="79" rx="32" ry="4" fill="#0b132b" opacity="0.25"/>

  <!-- Document body -->
  <path d="M 19 14
           C 19 10.5 21.5 8 25 8
           L 61 8
           L 77 24
           L 77 69
           C 77 72.5 74.5 75 71 75
           L 25 75
           C 21.5 75 19 72.5 19 69
           Z"
        fill="url(#vidDocGrad)"
        stroke="#e0e7ff"
        stroke-width="1"/>

  <!-- Folded top-right corner -->
  <path d="M 61 8 L 61 20 C 61 22.5 62.5 24 65 24 L 77 24 Z"
        fill="url(#vidFoldGrad)"/>

  <!-- Filmstrip perforations hint -->
  <rect x="28" y="24" width="28" height="3" rx="1.5" fill="#818cf8" opacity="0.5"/>
  <rect x="28" y="31" width="38" height="3" rx="1.5" fill="#cbd5e1" opacity="0.4"/>

  <!-- Video Card / Clapperboard badge -->
  <rect x="25" y="42" width="46" height="26" rx="4.5" fill="url(#vidBadgeGrad)"/>
  
  <!-- Film strip bar at top of badge -->
  <rect x="25" y="42" width="46" height="6" rx="2" fill="#1e1b4b"/>
  <rect x="28" y="43.5" width="4" height="3" rx="0.5" fill="#ffffff" opacity="0.75"/>
  <rect x="36" y="43.5" width="4" height="3" rx="0.5" fill="#ffffff" opacity="0.75"/>
  <rect x="44" y="43.5" width="4" height="3" rx="0.5" fill="#ffffff" opacity="0.75"/>
  <rect x="52" y="43.5" width="4" height="3" rx="0.5" fill="#ffffff" opacity="0.75"/>
  <rect x="60" y="43.5" width="4" height="3" rx="0.5" fill="#ffffff" opacity="0.75"/>

  <!-- Play Triangle -->
  <polygon points="45,50 45,63 56,56.5" fill="#ffffff"/>
</svg>