[package]
name = "shark"
version = "0.1.1"
edition = "2024"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false, features = ["wayland", "x11"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["wayland", "x11"] }
async-channel = "2"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "open_uri"] }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1"
sha2 = "0.10"
tempfile = "3"
libc = "0.2"
dirs = "5.0"
md-5 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
raw-window-handle = "0.6"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
log = "0.4"
env_logger = "0.11"

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.dev.package.gpui-pre]
incremental = false
